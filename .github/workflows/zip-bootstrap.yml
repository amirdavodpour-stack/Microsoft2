name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'ZIP filename in repository (leave blank to auto-detect)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  bootstrap:
    name: Extract ZIP, normalize repository, seed lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Extract ZIP into repository root
        shell: bash
        env:
          ARCHIVE_INPUT: ${{ inputs.archive }}
        run: ./tools/github/bootstrap_zip.sh

      - name: Generate or validate pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            echo 'pubspec.lock missing; resolving dependencies once and committing the generated lockfile.'
            flutter pub get
            test -s pubspec.lock
          fi

      - name: Validate repository bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -d lib
          test -d android
          test -x android/gradlew
          test -s pubspec.lock
          test -f .github/workflows/zip-build-and-report.yml
          ! find . -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .

      - name: Commit extracted project and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f --ignore-unmatch -- '*.zip' '*.ZIP' || true
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
          else
            git commit -m 'chore: bootstrap HOPE project from ZIP'
            git push
          fi

      - name: Bootstrap summary
        if: always()
        shell: bash
        run: |
          echo 'Bootstrap finished.'
          echo "Project root: $(pwd)"
          echo "Commit: $(git rev-parse HEAD)"
