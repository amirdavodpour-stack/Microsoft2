name: HOPE ZIP Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'ZIP filename in repository (leave blank to auto-detect)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  bootstrap:
    name: Extract ZIP, normalize repository, seed lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # FIX:
      # Do not depend on ./tools/github/bootstrap_zip.sh.
      # The previous workflow failed here with exit code 127 because
      # that file was not available at runtime.
      - name: Extract ZIP into repository root
        shell: bash
        env:
          ARCHIVE_INPUT: ${{ inputs.archive }}
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "Workspace: $PWD"

          archive="${ARCHIVE_INPUT:-}"

          if [[ -n "$archive" ]]; then
            if [[ ! -f "$archive" ]]; then
              echo "::error::Requested ZIP file does not exist: $archive"
              exit 1
            fi
          else
            mapfile -t zip_files < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                \( -iname '*.zip' \) \
                -print
            )

            if [[ ${#zip_files[@]} -eq 0 ]]; then
              echo "::error::No ZIP file found in repository root."
              exit 1
            fi

            if [[ ${#zip_files[@]} -gt 1 ]]; then
              echo "::error::Multiple ZIP files found. Specify the archive input."
              printf ' - %s\n' "${zip_files[@]}"
              exit 1
            fi

            archive="${zip_files[0]}"
          fi

          archive="$(realpath "$archive")"

          echo "Using archive: $archive"

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          echo "Extracting ZIP..."
          unzip -q "$archive" -d "$tmp_dir"

          # Detect Flutter project root.
          # Supports:
          #   project/pubspec.yaml
          #   pubspec.yaml directly at ZIP root
          mapfile -t pubspecs < <(
            find "$tmp_dir" \
              -type f \
              -name 'pubspec.yaml' \
              -print
          )

          if [[ ${#pubspecs[@]} -eq 0 ]]; then
            echo "::error::No pubspec.yaml found inside ZIP."
            exit 1
          fi

          if [[ ${#pubspecs[@]} -gt 1 ]]; then
            echo "::error::Multiple pubspec.yaml files found inside ZIP:"
            printf ' - %s\n' "${pubspecs[@]}"
            exit 1
          fi

          project_dir="$(dirname "${pubspecs[0]}")"

          echo "Detected Flutter project root: $project_dir"

          # Merge the extracted project into the checked-out repository.
          # Keep the Git metadata of the checked-out repository intact.
          rsync -a \
            --exclude='.git/' \
            "$project_dir/" \
            "$GITHUB_WORKSPACE/"

          echo "Repository after extraction:"
          ls -la

          test -f "$GITHUB_WORKSPACE/pubspec.yaml"

      - name: Generate or validate pubspec.lock
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f pubspec.yaml

          if [[ -f pubspec.lock ]]; then
            echo "pubspec.lock exists; validating locked dependencies."
            flutter pub get --enforce-lockfile
          else
            echo "pubspec.lock missing; resolving dependencies once."
            flutter pub get
            test -s pubspec.lock
          fi

      - name: Validate repository bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f pubspec.yaml
          test -d lib
          test -d android

          if [[ ! -x android/gradlew ]]; then
            echo "::warning::android/gradlew is not executable; fixing permission."
            chmod +x android/gradlew
          fi

          test -x android/gradlew
          test -s pubspec.lock

          test -f .github/workflows/zip-build-and-report.yml

          if find . \
            -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -print -quit | grep -q .; then
            echo "::error::Generated APK/AAB must not be committed during bootstrap."
            exit 1
          fi

      - name: Remove source ZIPs from repository
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE"

          git rm -f --ignore-unmatch -- \
            '*.zip' \
            '*.ZIP' || true

      - name: Commit extracted project and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
          else
            git commit -m 'chore: bootstrap HOPE project from ZIP'
            git push
          fi

      - name: Bootstrap summary
        if: always()
        shell: bash
        run: |
          echo 'Bootstrap finished.'
          echo "Project root: $(pwd)"
          echo "Commit: $(git rev-parse HEAD)"
